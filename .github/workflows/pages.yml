name: Test, build, and deploy Vanta Forge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run core engine tests
        run: npm test | tee docs/core-test-output.txt
      - name: Build portable editor and runtime
        run: npm run build
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify editor workflows and regenerate standalone game
        run: python tests/browser_smoke.py --software
      - name: Stage GitHub Pages application
        run: node tools/site.mjs
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            docs/browser-test-results.json
            docs/core-test-output.txt
            docs/test-artifacts/
          if-no-files-found: warn

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live editor, game, assets, and commit
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { setTimeout as delay } from 'node:timers/promises';
          const base = new URL(process.env.SITE_URL);
          const expected = process.env.EXPECTED_COMMIT;
          async function read(name) {
            const url = new URL(name, base);
            url.searchParams.set('deploy', expected);
            const response = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(20000) });
            assert.equal(response.status, 200, `${name}: HTTP ${response.status}`);
            return response.text();
          }
          for (let attempt = 1; ; attempt++) {
            try {
              const version = JSON.parse(await read('version.json'));
              assert.equal(version.product, 'Vanta Forge');
              assert.equal(version.commit, expected, 'CDN must serve the deployed commit');
              const [editor, game, portable, module, css, runtime] = await Promise.all(
                ['', 'aether-relay-game.html', 'vanta-forge.html', 'src/editor.js', 'styles.css', 'runtime.bundle.js'].map(read)
              );
              assert.match(editor, /src="src\/editor\.js"/);
              assert.match(editor, /Vanta Forge/);
              assert.match(game, /VantaRuntime\.launchStandalone/);
              assert.match(game, /scene-data/);
              assert.match(portable, /vanta-runtime-source/);
              assert.ok(module.length > 1000 && css.length > 1000 && runtime.length > 1000);
              console.log(`LIVE VERIFIED ${base.href} commit=${version.commit}; editor, portable editor, standalone game, and assets return HTTP 200.`);
              break;
            } catch (error) {
              if (attempt >= 12) throw error;
              console.log(`Waiting for Pages CDN propagation (${attempt}/12): ${error.message}`);
              await delay(5000);
            }
          }
          JS
